[versions]
agp = "9.2.1"
genaiSpeechRecognition = "1.0.0-alpha1"
gson = "2.14.0"
imageLabeling = "17.0.9"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
lombok = "1.18.48"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
objectDetection = "17.0.2"
okhttp = "4.12.0"
roomCompiler = "2.8.5"
textRecognitionDevanagari = "16.0.1"

[libraries]
genai-speech-recognition = { module = "com.google.mlkit:genai-speech-recognition", version.ref = "genaiSpeechRecognition" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
image-labeling = { module = "com.google.mlkit:image-labeling", version.ref = "imageLabeling" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
object1-detection = { module = "com.google.mlkit:object-detection", version.ref = "objectDetection" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomCompiler" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomCompiler" }
text-recognition-devanagari = { module = "com.google.mlkit:text-recognition-devanagari", version.ref = "textRecognitionDevanagari" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

